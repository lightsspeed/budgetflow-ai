services:
  # ── BudgetFlow Next.js App ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budgetflow_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ── Persistence note ──────────────────────────────────────────────────────────
